name: Auto-Merge Passing PRs

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.draft == false &&
      (github.event.sender.login == 'xarlord' ||
      contains(github.event.pull_request.head.ref, 'auto-review'))
    steps:
      - name: Enable protected native auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          PR=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json state,isDraft,baseRefName,headRefOid)

          test "$(jq -r '.state' <<<"$PR")" = "OPEN"
          test "$(jq -r '.isDraft' <<<"$PR")" = "false"
          test "$(jq -r '.baseRefName' <<<"$PR")" = "master"
          test "$(jq -r '.headRefOid' <<<"$PR")" = "$EXPECTED_HEAD_SHA"

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto
