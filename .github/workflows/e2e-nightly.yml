name: Nightly E2E — Live Scenarios

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test against (empty uses the local integrated stack)'
        required: false
        default: ''

jobs:
  local-e2e:
    name: 🎭 Local E2E — ${{ matrix.label }}
    if: github.event_name == 'schedule' || inputs.base_url == '' || inputs.base_url == 'http://localhost:3000'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: critical
            label: Critical User Flows
            specs: >-
              01-authentication.spec.ts
              02-chart-creation.spec.ts
              03-transits.spec.ts
              06-full-user-journey.spec.ts
              smoke-core-flows.spec.ts
          - phase: console
            label: Console Error Audit
            specs: >-
              00-console-audit.spec.ts
              console-error-check.spec.ts
              13-full-user-flow-console-monitored.spec.ts
          - phase: accessibility
            label: Accessibility Audit
            specs: accessibility-audit.spec.ts

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astrology_saas
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d astrology_saas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TARGET_KIND: local
      BASE_URL: http://localhost:3000
      NODE_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: 5434
      DATABASE_NAME: astrology_saas
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: test-jwt-secret-for-e2e
      CSRF_SECRET: test-csrf-secret-for-e2e
      RATE_LIMIT_MAX_REQUESTS: 10000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run database migrations
        run: cd backend && npx tsx ../node_modules/knex/bin/cli.js migrate:latest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/astrology_saas

      - name: Start backend server
        run: |
          cd backend
          npx tsx src/server.ts &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health >/dev/null; then
              echo "Backend server is ready"
              exit 0
            fi
            echo "Waiting for backend server... ($i/30)"
            sleep 2
          done
          echo "Backend server did not become ready" >&2
          exit 1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/astrology_saas

      - name: Start frontend dev server
        run: |
          cd frontend
          npx vite --host 0.0.0.0 --port 3000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null; then
              echo "Frontend server is ready"
              exit 0
            fi
            echo "Waiting for frontend server... ($i/30)"
            sleep 2
          done
          echo "Frontend server did not become ready" >&2
          exit 1

      - name: Run bounded Playwright phase
        run: |
          mkdir -p "frontend/test-results/${{ matrix.phase }}"
          echo "phase=${{ matrix.phase }} target=$BASE_URL status=started" > "frontend/test-results/${{ matrix.phase }}/phase-status.txt"
          set +e
          cd frontend
          timeout --signal=INT --kill-after=30s 20m \
            npx playwright test ${{ matrix.specs }} \
              --project=chromium \
              --output="test-results/${{ matrix.phase }}"
          status=$?
          set -e
          echo "phase=${{ matrix.phase }} target=$BASE_URL exit_code=$status" >> "test-results/${{ matrix.phase }}/phase-status.txt"
          exit "$status"

      - name: Upload phase evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: nightly-local-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/${{ matrix.phase }}/
            frontend/test-results.json
          retention-days: 14

      - name: Summarize phase
        if: ${{ always() }}
        run: |
          node .github/scripts/summarize-playwright.mjs \
            frontend/test-results.json \
            "${{ matrix.label }}" \
            "$BASE_URL" \
            "nightly-${TARGET_KIND}-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}"

  remote-e2e:
    name: 🎭 Remote E2E — ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch' && inputs.base_url != '' && inputs.base_url != 'http://localhost:3000'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: critical
            label: Critical User Flows
            specs: >-
              01-authentication.spec.ts
              02-chart-creation.spec.ts
              03-transits.spec.ts
              06-full-user-journey.spec.ts
              smoke-core-flows.spec.ts
          - phase: console
            label: Console Error Audit
            specs: >-
              00-console-audit.spec.ts
              console-error-check.spec.ts
              13-full-user-flow-console-monitored.spec.ts
          - phase: accessibility
            label: Accessibility Audit
            specs: accessibility-audit.spec.ts

    env:
      TARGET_KIND: remote
      BASE_URL: ${{ inputs.base_url }}
      PLAYWRIGHT_SKIP_WEBSERVER: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run bounded Playwright phase
        run: |
          mkdir -p "frontend/test-results/${{ matrix.phase }}"
          echo "phase=${{ matrix.phase }} target=$BASE_URL status=started" > "frontend/test-results/${{ matrix.phase }}/phase-status.txt"
          set +e
          cd frontend
          timeout --signal=INT --kill-after=30s 20m \
            npx playwright test ${{ matrix.specs }} \
              --project=chromium \
              --output="test-results/${{ matrix.phase }}"
          status=$?
          set -e
          echo "phase=${{ matrix.phase }} target=$BASE_URL exit_code=$status" >> "test-results/${{ matrix.phase }}/phase-status.txt"
          exit "$status"

      - name: Upload phase evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: nightly-remote-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/${{ matrix.phase }}/
            frontend/test-results.json
          retention-days: 14

      - name: Summarize phase
        if: ${{ always() }}
        run: |
          node .github/scripts/summarize-playwright.mjs \
            frontend/test-results.json \
            "${{ matrix.label }}" \
            "$BASE_URL" \
            "nightly-${TARGET_KIND}-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}"

  nightly-e2e-gate:
    name: 🎭 Nightly E2E Aggregate Gate
    needs: [local-e2e, remote-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      HAS_SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
    steps:
      - name: Require the selected target matrix to pass
        env:
          LOCAL_RESULT: ${{ needs.local-e2e.result }}
          REMOTE_RESULT: ${{ needs.remote-e2e.result }}
        run: |
          echo "Local matrix: $LOCAL_RESULT"
          echo "Remote matrix: $REMOTE_RESULT"
          if { [ "$LOCAL_RESULT" = success ] && [ "$REMOTE_RESULT" = skipped ]; } || \
             { [ "$LOCAL_RESULT" = skipped ] && [ "$REMOTE_RESULT" = success ]; }; then
            exit 0
          fi
          echo "The selected nightly E2E matrix did not pass" >&2
          exit 1

      - name: Notify on failure
        if: failure() && env.HAS_SLACK_WEBHOOK == 'true'
        uses: slackapi/slack-github-action@v1.27.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          payload: |
            {
              "text": "❌ AstroVerse Nightly E2E Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *AstroVerse Nightly E2E tests failed*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }
                }
              ]
            }
